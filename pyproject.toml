# Two environments exist for this repository and they are deliberately separate:
#
#   1. This file: a small, Isaac-free env for the analysis/rendering half of the project
#      (`tools/plot.py`, `tools/render.py`, `tools/analyze_failure.py`, `tools/urdf_to_mjcf.py`,
#      `supermimic/kinematics.py`, ...). Created by `uv sync` at the repository root.
#   2. The full training env, which needs Isaac Lab 3 and is defined by Isaac Lab's own uv project
#      (`uv sync --frozen --extra all --extra importers` inside the pinned checkout, exactly what
#      `IsaacLab/docker/Dockerfile.kitless` does). `tools/setup_uv.sh` sets it up; see README.md.
#
# Training/evaluation (`supermimic/train.py`, `supermimic/evaluate.py`, `supermimic/env.py`,
# `supermimic/robot.py`, `tools/test_*.py`, `tools/bench.py`) import `isaaclab` and therefore need
# environment 2, not this one.

[project]
name = "supermimic"
version = "0.1.0"
description = "Analysis-only Python environment for the SuperMimic reproduction (plot, render, FK)"
requires-python = ">=3.12,<3.13"  # same interpreter minor as the kit-less image (Isaac Lab 3 pins 3.12)
dependencies = [
    "numpy>=2",
    "torch==2.11.0",    # Isaac Lab 3.0.0's pin, so checkpoints and recorded tensors stay compatible
    "mujoco~=3.15.0",   # the pin newton[sim] uses; needed for torch FK cross-checks and render.py
    "matplotlib>=3.10.3",
    "pillow>=12.3.0",   # render.py text overlays
]

[tool.uv]
# The repository is not an installable package: the code is used in place (`python tools/plot.py`)
# with the repository root on sys.path.
package = false
